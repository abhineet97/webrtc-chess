<!doctype html>
<html>
  <head>
    <title>WebRTC Chess</title>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="/app/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>WebRTC Chess</h1>
      </header>
      <div class="board-wrap">
        <div id="board" class="blur"></div>
        <div id="info">
          <div class="card">
            <div id="spinner" class="spinner"></div>
            <p id="message" class="message hidden"></p>
            <p id="link" class="link hidden"></p>
            <button id="action" type="button" class="link-button hidden"></button>
          </div>
        </div>
      </div>
      <footer>An experiment by <a href="https://abhin33t.zip">Abhineet</a></footer>
    </main>
  </body>
</html>
